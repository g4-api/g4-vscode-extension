<!--
    G4 section: a foldable page section - chevron, title, and optional warning in the header; a
    description, the content, and an optional status line in the body. See g4-section.js.
-->
<template id="g4-section-template">
    <div class="g4-section__header" data-part="header" data-test-id="header">
        <i class="g4-section__chevron" data-part="chevron">
            <svg class="g4-section__chevron-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M441.3 299.8C451.5 312.4 450.8 330.9 439.1 342.6L311.1 470.6C301.9 479.8 288.2 482.5 276.2 477.5C264.2 472.5 256.5 460.9 256.5 448L256.5 192C256.5 179.1 264.3 167.4 276.3 162.4C288.3 157.4 302 160.2 311.2 169.3L439.2 297.3L441.4 299.7z"/></svg>
            <svg class="g4-section__chevron-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M300.3 440.8C312.9 451 331.4 450.3 343.1 438.6L471.1 310.6C480.3 301.4 483 287.7 478 275.7C473 263.7 461.4 256 448.5 256L192.5 256C179.6 256 167.9 263.8 162.9 275.8C157.9 287.8 160.7 301.5 169.9 310.6L297.9 438.6L300.3 440.8z"/></svg>
        </i>
        <span class="g4-section__title" data-part="title" data-test-id="title"></span>
        <span class="g4-section__warning" data-part="warning" data-test-id="warning"></span>
    </div>
    <div class="g4-section__body" data-part="body" data-test-id="body">
        <div class="g4-section__description" data-part="description" data-test-id="description"></div>
        <div class="g4-section__status"
             data-part="status"
             data-test-id="status-message"
             aria-live="polite"></div>
    </div>
</template>

<!-- Warning shown in the header: a triangle and a short label. -->
<template id="g4-section-warning-template">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" aria-hidden="true"><path fill="currentColor" d="M320 64C334.7 64 348.2 72.1 355.2 85L571.2 485C577.9 497.4 577.6 512.4 570.4 524.5C563.2 536.6 550.1 544 536 544L104 544C89.9 544 76.8 536.6 69.6 524.5C62.4 512.4 62.1 497.4 68.8 485L284.8 85C291.8 72.1 305.3 64 320 64zM320 416C302.3 416 288 430.3 288 448C288 465.7 302.3 480 320 480C337.7 480 352 465.7 352 448C352 430.3 337.7 416 320 416zM320 224C301.8 224 287.3 239.5 288.6 257.7L296 361.7C296.9 374.2 307.4 384 319.9 384C332.5 384 342.9 374.3 343.8 361.7L351.2 257.7C352.5 239.5 338.1 224 319.8 224z"/></svg><span data-part="warning-label"></span>
</template>
