<!--
    G4 toggle: an on/off switch with a label and a hint beside it. See g4-toggle.js.
-->
<template id="g4-toggle-template">
    <label class="g4-toggle__label" data-test-id="label">
        <input type="checkbox"
               class="g4-toggle__input"
               data-part="input"
               data-test-id="checkbox">
        <span class="g4-toggle__switch"></span>
        <span class="g4-toggle__text">
            <span class="g4-toggle__title" data-part="title"></span>
            <span class="g4-toggle__hint" data-part="hint"></span>
        </span>
    </label>
</template>
