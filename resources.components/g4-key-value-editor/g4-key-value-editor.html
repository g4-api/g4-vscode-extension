<!--
    G4 key/value editor: one key box and one value box per entry with a trash button, plus an add
    button. See g4-key-value-editor.js.
-->
<template id="g4-key-value-editor-template">
    <div class="g4-key-value-editor__rows" data-part="rows" data-test-id="rows"></div>
    <div class="g4-key-value-editor__add-row">
        <button type="button"
                class="g4-key-value-editor__button"
                data-part="add"
                data-test-id="add-button"></button>
    </div>
</template>

<!-- One entry: its row (key, value, trash) and the error line under it. -->
<template id="g4-key-value-editor-row-template">
    <div class="g4-key-value-editor__entry">
        <div class="g4-key-value-editor__row">
            <input type="text"
                   class="g4-key-value-editor__input g4-key-value-editor__input--key"
                   data-part="key"
                   data-test-id="key-input"
                   autocomplete="off"
                   spellcheck="false">
            <input type="text"
                   class="g4-key-value-editor__input"
                   data-part="value"
                   data-test-id="value-input"
                   autocomplete="off"
                   spellcheck="false">
            <button type="button"
                    class="g4-key-value-editor__button g4-key-value-editor__button--icon"
                    data-part="remove"
                    data-test-id="remove-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" aria-hidden="true"><path fill="currentColor" d="M232.7 69.9C237.1 56.8 249.3 48 263.1 48L377 48C390.8 48 403 56.8 407.4 69.9L416 96L512 96C529.7 96 544 110.3 544 128C544 145.7 529.7 160 512 160L128 160C110.3 160 96 145.7 96 128C96 110.3 110.3 96 128 96L224 96L232.7 69.9zM128 208L512 208L512 512C512 547.3 483.3 576 448 576L192 576C156.7 576 128 547.3 128 512L128 208zM216 272C202.7 272 192 282.7 192 296L192 488C192 501.3 202.7 512 216 512C229.3 512 240 501.3 240 488L240 296C240 282.7 229.3 272 216 272zM320 272C306.7 272 296 282.7 296 296L296 488C296 501.3 306.7 512 320 512C333.3 512 344 501.3 344 488L344 296C344 282.7 333.3 272 320 272zM424 272C410.7 272 400 282.7 400 296L400 488C400 501.3 410.7 512 424 512C437.3 512 448 501.3 448 488L448 296C448 282.7 437.3 272 424 272z"/></svg>
            </button>
        </div>
        <div class="g4-key-value-editor__error"
             data-part="error"
             data-test-id="error-message"
             role="alert"></div>
    </div>
</template>

<!-- Shown instead of the rows when there are no entries. -->
<template id="g4-key-value-editor-empty-template">
    <div class="g4-key-value-editor__empty" data-part="empty" data-test-id="empty-message"></div>
</template>
