<!--
    G4 Markdown text area: a numbered, non-wrapping text box with Markdown reference and Expand corner
    buttons. See g4-markdown-textarea.js.
-->
<template id="g4-markdown-textarea-template" data-dependencies="g4-line-numbers g4-expand-editor g4-modal">
    <div class="g4-markdown-textarea__box">
        <g4-line-numbers></g4-line-numbers>
        <textarea class="g4-markdown-textarea__input"
                  data-part="textarea"
                  data-test-id="textarea"
                  wrap="off"></textarea>
        <div class="g4-markdown-textarea__tools">
            <button type="button"
                    class="g4-markdown-textarea__tool"
                    title="Markdown reference"
                    data-part="reference"
                    data-test-id="markdown-button"
                    aria-label="Markdown reference">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" aria-hidden="true"><path fill="currentColor" d="M593.8 123.1L46.2 123.1C20.7 123.1 0 143.8 0 169.2L0 470.7C0 496.2 20.7 516.9 46.2 516.9L593.9 516.9C619.4 516.9 640.1 496.2 640 470.8L640 169.2C640 143.8 619.3 123.1 593.8 123.1zM338.5 424.6L277 424.6L277 304.6L215.5 381.5L154 304.6L154 424.6L92.3 424.6L92.3 215.4L153.8 215.4L215.3 292.3L276.8 215.4L338.3 215.4L338.3 424.6L338.5 424.6zM473.8 427.7L381.5 320L443 320L443 215.4L504.5 215.4L504.5 320L566 320L473.8 427.7z"/></svg>
            </button>
            <button type="button"
                    class="g4-markdown-textarea__tool"
                    title="Expand"
                    data-part="expand"
                    data-test-id="expand-button"
                    aria-label="Expand">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" aria-hidden="true"><path fill="currentColor" d="M128 96C110.3 96 96 110.3 96 128L96 224C96 241.7 110.3 256 128 256C145.7 256 160 241.7 160 224L160 160L224 160C241.7 160 256 145.7 256 128C256 110.3 241.7 96 224 96L128 96zM160 416C160 398.3 145.7 384 128 384C110.3 384 96 398.3 96 416L96 512C96 529.7 110.3 544 128 544L224 544C241.7 544 256 529.7 256 512C256 494.3 241.7 480 224 480L160 480L160 416zM416 96C398.3 96 384 110.3 384 128C384 145.7 398.3 160 416 160L480 160L480 224C480 241.7 494.3 256 512 256C529.7 256 544 241.7 544 224L544 128C544 110.3 529.7 96 512 96L416 96zM544 416C544 398.3 529.7 384 512 384C494.3 384 480 398.3 480 416L480 480L416 480C398.3 480 384 494.3 384 512C384 529.7 398.3 544 416 544L512 544C529.7 544 544 529.7 544 512L544 416z"/></svg>
            </button>
        </div>
    </div>
</template>

<!-- Markdown reference button for the expanded editor's header. -->
<template id="g4-markdown-textarea-editor-tools-template">
    <button type="button"
            class="g4-markdown-textarea__tool g4-markdown-textarea__tool--header"
            title="Markdown reference"
            data-test-id="expand-editor-markdown-button"
            aria-label="Markdown reference">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" aria-hidden="true"><path fill="currentColor" d="M593.8 123.1L46.2 123.1C20.7 123.1 0 143.8 0 169.2L0 470.7C0 496.2 20.7 516.9 46.2 516.9L593.9 516.9C619.4 516.9 640.1 496.2 640 470.8L640 169.2C640 143.8 619.3 123.1 593.8 123.1zM338.5 424.6L277 424.6L277 304.6L215.5 381.5L154 304.6L154 424.6L92.3 424.6L92.3 215.4L153.8 215.4L215.3 292.3L276.8 215.4L338.3 215.4L338.3 424.6L338.5 424.6zM473.8 427.7L381.5 320L443 320L443 215.4L504.5 215.4L504.5 320L566 320L473.8 427.7z"/></svg>
    </button>
</template>

<!-- Static Markdown reference: what to type and how it looks, for the common elements. -->
<template id="g4-markdown-textarea-reference-template">
    <div class="g4-markdown-textarea__reference-note" data-part="reference-note"></div>
    <table class="g4-markdown-textarea__reference" data-test-id="markdown-reference-table">
        <thead>
            <tr><th scope="col">Element</th><th scope="col">You type</th><th scope="col">It looks like</th></tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">Heading</th>
                <td><pre class="g4-markdown-textarea__syntax"># Title
## Section
### Subsection</pre></td>
                <td class="g4-markdown-textarea__result"><h3>Title</h3><h4>Section</h4><h5>Subsection</h5></td>
            </tr>
            <tr>
                <th scope="row">Bold</th>
                <td><pre class="g4-markdown-textarea__syntax">**bold text**</pre></td>
                <td class="g4-markdown-textarea__result"><strong>bold text</strong></td>
            </tr>
            <tr>
                <th scope="row">Italic</th>
                <td><pre class="g4-markdown-textarea__syntax">*italic text*</pre></td>
                <td class="g4-markdown-textarea__result"><em>italic text</em></td>
            </tr>
            <tr>
                <th scope="row">Strikethrough</th>
                <td><pre class="g4-markdown-textarea__syntax">~~removed text~~</pre></td>
                <td class="g4-markdown-textarea__result"><del>removed text</del></td>
            </tr>
            <tr>
                <th scope="row">Inline code</th>
                <td><pre class="g4-markdown-textarea__syntax">Run `npm install` first.</pre></td>
                <td class="g4-markdown-textarea__result">Run <code>npm install</code> first.</td>
            </tr>
            <tr>
                <th scope="row">Code block</th>
                <td><pre class="g4-markdown-textarea__syntax">```json
{ "key": "value" }
```</pre></td>
                <td class="g4-markdown-textarea__result"><pre><code>{ "key": "value" }</code></pre></td>
            </tr>
            <tr>
                <th scope="row">Link</th>
                <td><pre class="g4-markdown-textarea__syntax">[G4 Hub](https://example.com)</pre></td>
                <td class="g4-markdown-textarea__result"><a href="#" tabindex="-1">G4 Hub</a></td>
            </tr>
            <tr>
                <th scope="row">Bulleted list</th>
                <td><pre class="g4-markdown-textarea__syntax">- First item
- Second item
  - Nested item</pre></td>
                <td class="g4-markdown-textarea__result"><ul><li>First item</li><li>Second item<ul><li>Nested item</li></ul></li></ul></td>
            </tr>
            <tr>
                <th scope="row">Numbered list</th>
                <td><pre class="g4-markdown-textarea__syntax">1. First step
2. Second step</pre></td>
                <td class="g4-markdown-textarea__result"><ol><li>First step</li><li>Second step</li></ol></td>
            </tr>
            <tr>
                <th scope="row">Blockquote</th>
                <td><pre class="g4-markdown-textarea__syntax">&gt; Note: runs on Windows only.</pre></td>
                <td class="g4-markdown-textarea__result"><blockquote>Note: runs on Windows only.</blockquote></td>
            </tr>
            <tr>
                <th scope="row">Table</th>
                <td><pre class="g4-markdown-textarea__syntax">| Name | Type |
| ---- | ---- |
| Url  | String |</pre></td>
                <td class="g4-markdown-textarea__result"><table><thead><tr><th>Name</th><th>Type</th></tr></thead><tbody><tr><td>Url</td><td>String</td></tr></tbody></table></td>
            </tr>
            <tr>
                <th scope="row">Horizontal rule</th>
                <td><pre class="g4-markdown-textarea__syntax">Above

---

Below</pre></td>
                <td class="g4-markdown-textarea__result">Above<hr>Below</td>
            </tr>
        </tbody>
    </table>
</template>
