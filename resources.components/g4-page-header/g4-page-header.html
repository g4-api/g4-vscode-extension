<!--
    G4 page header: the page title, one line of details, and optional items on the right. See g4-page-header.js.
-->
<template id="g4-page-header-template">
    <div class="g4-page-header__bar" data-test-id="bar">
        <div>
            <div class="g4-page-header__title" data-part="title" data-test-id="title"></div>
            <div class="g4-page-header__meta" data-part="meta" data-test-id="meta"></div>
        </div>
        <div class="g4-page-header__right" data-part="right" data-test-id="right"></div>
    </div>
</template>
