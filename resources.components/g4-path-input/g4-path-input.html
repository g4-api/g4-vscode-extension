<!--
    G4 path input: a folder path box with a Browse (search icon) button and an optional text button
    that finds the path automatically. See g4-path-input.js.
-->
<template id="g4-path-input-template">
    <div class="g4-path-input__wrap">
        <input type="text"
               class="g4-path-input__input"
               data-part="input"
               data-test-id="input"
               autocomplete="off"
               spellcheck="false">
        <button type="button"
                class="g4-path-input__button g4-path-input__button--icon"
                data-part="browse"
                data-test-id="browse-button">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" aria-hidden="true"><path fill="currentColor" d="M480 272C480 317.9 465.1 360.3 440 394.7L566.6 521.4C579.1 533.9 579.1 554.2 566.6 566.7C554.1 579.2 533.8 579.2 521.3 566.7L394.7 440C360.3 465.1 317.9 480 272 480C157.1 480 64 386.9 64 272C64 157.1 157.1 64 272 64C386.9 64 480 157.1 480 272zM272 416C351.5 416 416 351.5 416 272C416 192.5 351.5 128 272 128C192.5 128 128 192.5 128 272C128 351.5 192.5 416 272 416z"/></svg>
        </button>
        <button type="button"
                class="g4-path-input__button"
                data-part="detect"
                data-test-id="detect-button"></button>
    </div>
</template>
