<!--
    G4 toggle dropdown: a button that shows what is picked and opens a list of on/off switches below
    it, one per choice. See g4-toggle-dropdown.js.
-->
<template id="g4-toggle-dropdown-template" data-dependencies="g4-toggle">
    <div class="g4-toggle-dropdown__wrap" data-part="wrap">
        <button type="button"
                class="g4-toggle-dropdown__trigger"
                data-part="trigger"
                data-test-id="trigger-button"
                aria-expanded="false"
                aria-haspopup="true">
            <span class="g4-toggle-dropdown__summary" data-part="summary" data-test-id="summary"></span>
            <svg class="g4-toggle-dropdown__chevron"
                 aria-hidden="true"
                 viewBox="0 0 640 640"
                 xmlns="http://www.w3.org/2000/svg"><path d="M297.4 438.6C309.9 451.1 330.2 451.1 342.7 438.6L502.7 278.6C515.2 266.1 515.2 245.8 502.7 233.3C490.2 220.8 469.9 220.8 457.4 233.3L320 370.7L182.6 233.4C170.1 220.9 149.8 220.9 137.3 233.4C124.8 245.9 124.8 266.2 137.3 278.7L297.3 438.7z" fill="currentColor"/></svg>
        </button>
        <div class="g4-toggle-dropdown__panel"
             data-part="panel"
             data-test-id="panel"
             hidden
             role="group"></div>
    </div>
</template>
