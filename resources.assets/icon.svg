<svg xmlns="http://www.w3.org/2000/svg" viewBox="-4 -4 32 32">
    <!-- The G4 double orbit on a dark tile: master of icon.png. -->
    <defs>
    <linearGradient id="tile" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#30353d"/><stop offset="1" stop-color="#1b1e23"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" result="blur" stdDeviation="0.9"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    </defs>
    <rect fill="url(#tile)" height="32" rx="7" width="32" x="-4" y="-4"/>
    <g filter="url(#glow)">
    <path d="M20.69 9.67A9 9 0 1 1 14.33 3.31" fill="none" stroke="#2aa8ef" stroke-linecap="round" stroke-width="2"/>
    <circle cx="18.36" cy="5.64" fill="#22e5ff" r="1.8"/>
    <path d="M7.56 13.19A4.6 4.6 0 1 1 10.81 16.44" fill="none" stroke="#2aa8ef" stroke-linecap="round" stroke-width="2"/>
    </g>
</svg>
