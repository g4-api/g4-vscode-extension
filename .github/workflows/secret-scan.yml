name: Secret scan

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.http'
      - '**/*.json'

permissions:
  contents: read

env:
  GITLEAKS_VERSION: '8.18.4'

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect changed .md, .http and .json files
        run: |
          mkdir -p "$RUNNER_TEMP/scan"
          git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" \
            | grep -E '\.(md|http|json)$' \
            | while read -r file; do
                cp --parents "$file" "$RUNNER_TEMP/scan/"
              done || true
          echo "Files to scan:"
          find "$RUNNER_TEMP/scan" -type f | wc -l

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $archive\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan
        run: |
          "$RUNNER_TEMP/gitleaks" detect --no-git --source "$RUNNER_TEMP/scan" --redact --verbose --exit-code 1
